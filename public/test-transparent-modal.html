<!DOCTYPE html>
<html>
<head>
    <title>Transparent Modal Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .test-card {
            cursor: pointer;
            transition: transform 0.3s;
        }
        .test-card:hover {
            transform: translateY(-5px);
        }

        /* Transparent Modal Styles */
        #imageModal .modal-content {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }
        #imageModal .modal-header {
            background: transparent !important;
            border: none !important;
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1060;
            padding: 0;
        }
        #imageModal .modal-title {
            display: none;
        }
        #imageModal .btn-close {
            background: rgba(255, 255, 255, 0.8) !important;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            opacity: 0.8;
            transition: all 0.3s ease;
        }
        #imageModal .btn-close:hover {
            background: rgba(255, 255, 255, 1) !important;
            opacity: 1;
            transform: scale(1.1);
        }
        #imageModal .modal-body {
            background: transparent !important;
            border: none !important;
            padding: 20px;
            position: relative;
        }
        #imageModal #modalImage {
            max-height: 90vh;
            width: auto;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        #imageModal #modalTitle,
        #imageModal #modalDescription {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            margin: 10px auto;
            max-width: 80%;
            backdrop-filter: blur(10px);
        }
        #imageModal #modalTitle {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 5px;
        }
        #imageModal #galleryNav {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            border-radius: 25px;
            padding: 10px 20px;
            backdrop-filter: blur(10px);
        }
        #imageModal #galleryNav .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            margin: 0 5px;
        }
        #imageModal #galleryNav .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }
        #imageModal #imageCounter {
            color: white !important;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-white text-center mb-5">Transparent Modal Gallery Test</h1>
        <p class="text-white text-center">Click on images to test the completely transparent modal</p>

        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card test-card"
                     data-image="http://127.0.0.1:8000/storage/gallery/6rB3XsF8ztfFhydq5ypVjJRqDtXGLpCN1Pt6aWN8.jpg"
                     data-title="Beautiful Landscape"
                     data-description="A stunning view of nature's beauty captured in perfect lighting">
                    <img src="http://127.0.0.1:8000/storage/gallery/6rB3XsF8ztfFhydq5ypVjJRqDtXGLpCN1Pt6aWN8.jpg"
                         class="card-img-top" alt="Test 1" style="height: 200px; object-fit: cover;">
                    <div class="card-body">
                        <h5>Test Image 1</h5>
                        <p>Click to view in transparent modal</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card test-card"
                     data-image="http://127.0.0.1:8000/storage/gallery/RXbACa30tohOJAur5bwIHAVbFvElow2fhvjJm96M.png"
                     data-title="Modern Architecture"
                     data-description="Clean lines and contemporary design showcase modern architectural excellence">
                    <img src="http://127.0.0.1:8000/storage/gallery/RXbACa30tohOJAur5bwIHAVbFvElow2fhvjJm96M.png"
                         class="card-img-top" alt="Test 2" style="height: 200px; object-fit: cover;">
                    <div class="card-body">
                        <h5>Test Image 2</h5>
                        <p>Another test image</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card test-card"
                     data-image="https://picsum.photos/800/600?random=3"
                     data-title="Random Sample"
                     data-description="A randomly generated placeholder image for testing purposes">
                    <img src="https://picsum.photos/400/300?random=3"
                         class="card-img-top" alt="Test 3" style="height: 200px; object-fit: cover;">
                    <div class="card-body">
                        <h5>Test Image 3</h5>
                        <p>Random placeholder</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Transparent Modal -->
    <div class="modal fade" id="imageModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Photo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <img src="" alt="" class="img-fluid mb-3" id="modalImage">
                    <h6 id="modalTitle"></h6>
                    <p id="modalDescription"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            const modalTitle = document.getElementById('modalTitle');
            const modalDescription = document.getElementById('modalDescription');
            const testCards = document.querySelectorAll('.test-card');

            let currentIndex = 0;
            let bsModal = null;

            // Handle clicks
            testCards.forEach((card, index) => {
                card.addEventListener('click', function() {
                    modalImage.src = this.dataset.image;
                    modalTitle.textContent = this.dataset.title;
                    modalDescription.textContent = this.dataset.description;
                    currentIndex = index;

                    if (!bsModal) {
                        bsModal = new bootstrap.Modal(modal);
                    }
                    bsModal.show();
                });
            });

            // Add navigation when modal is shown
            modal.addEventListener('shown.bs.modal', function() {
                const modalBody = modal.querySelector('.modal-body');
                if (modalBody && !document.getElementById('galleryNav') && testCards.length > 1) {
                    const nav = document.createElement('div');
                    nav.id = 'galleryNav';
                    nav.className = 'd-flex justify-content-between align-items-center';
                    nav.innerHTML = `
                        <button type="button" class="btn btn-sm" onclick="navigate(-1)">
                            <i class="fas fa-chevron-left"></i> Previous
                        </button>
                        <span id="imageCounter">${currentIndex + 1} of ${testCards.length}</span>
                        <button type="button" class="btn btn-sm" onclick="navigate(1)">
                            Next <i class="fas fa-chevron-right"></i>
                        </button>
                    `;
                    modalBody.appendChild(nav);
                }
            });

            // Navigation function
            window.navigate = function(direction) {
                const newIndex = (currentIndex + direction + testCards.length) % testCards.length;
                const newCard = testCards[newIndex];

                modalImage.src = newCard.dataset.image;
                modalTitle.textContent = newCard.dataset.title;
                modalDescription.textContent = newCard.dataset.description;
                currentIndex = newIndex;

                const counter = document.getElementById('imageCounter');
                if (counter) {
                    counter.textContent = `${currentIndex + 1} of ${testCards.length}`;
                }
            };
        });
    </script>
</body>
</html>
