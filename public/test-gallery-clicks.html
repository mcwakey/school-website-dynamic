<!DOCTYPE html>
<html>
<head>
    <title>Gallery Click Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .test-gallery-card {
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            height: 300px;
            position: relative;
            overflow: hidden;
            margin: 10px;
        }
        .test-gallery-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .test-gallery-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .test-click-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
        }
        .test-gallery-card:hover .test-click-indicator i {
            opacity: 1 !important;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>Gallery Click Test</h1>
        <p><strong>Instructions:</strong> Click anywhere on the cards below. The magnify icon should be visible and clicking should work.</p>

        <div class="row">
            <div class="col-md-6">
                <div class="card test-gallery-card"
                     data-image="http://127.0.0.1:8000/storage/gallery/6rB3XsF8ztfFhydq5ypVjJRqDtXGLpCN1Pt6aWN8.jpg"
                     data-title="Test Image 1"
                     data-description="First test image">
                    <img src="http://127.0.0.1:8000/storage/gallery/6rB3XsF8ztfFhydq5ypVjJRqDtXGLpCN1Pt6aWN8.jpg" alt="Test 1">
                    <div class="test-click-indicator">
                        <i class="fas fa-search-plus text-white" style="font-size: 2.5rem; opacity: 0.7; text-shadow: 0 0 10px rgba(0,0,0,0.8); transition: opacity 0.3s;"></i>
                    </div>
                    <div class="card-body">
                        <h5>Test Image 1</h5>
                        <p>Click me to test the lightbox!</p>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card test-gallery-card"
                     data-image="http://127.0.0.1:8000/storage/gallery/RXbACa30tohOJAur5bwIHAVbFvElow2fhvjJm96M.png"
                     data-title="Test Image 2"
                     data-description="Second test image">
                    <img src="http://127.0.0.1:8000/storage/gallery/RXbACa30tohOJAur5bwIHAVbFvElow2fhvjJm96M.png" alt="Test 2">
                    <div class="test-click-indicator">
                        <i class="fas fa-search-plus text-white" style="font-size: 2.5rem; opacity: 0.7; text-shadow: 0 0 10px rgba(0,0,0,0.8); transition: opacity 0.3s;"></i>
                    </div>
                    <div class="card-body">
                        <h5>Test Image 2</h5>
                        <p>Click me too!</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="console" style="background: #f8f9fa; padding: 15px; margin: 20px 0; border-radius: 8px;">
            <strong>Console Output:</strong><br>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="imageModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Photo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <img src="" alt="" class="img-fluid mb-3" id="modalImage">
                    <h6 id="modalTitle"></h6>
                    <p id="modalDescription"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function log(msg) {
            console.log(msg);
            document.getElementById('console').innerHTML += msg + '<br>';
        }

        document.addEventListener('DOMContentLoaded', function() {
            log('DOM loaded - Testing gallery clicks');

            if (typeof bootstrap === 'undefined') {
                log('❌ Bootstrap not loaded!');
                return;
            }
            log('✅ Bootstrap loaded');

            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            const modalTitle = document.getElementById('modalTitle');
            const modalDescription = document.getElementById('modalDescription');
            const galleryCards = document.querySelectorAll('.test-gallery-card');

            log('Found ' + galleryCards.length + ' gallery cards');

            let bsModal = null;

            galleryCards.forEach((card, index) => {
                log('Setting up click handler for card ' + index);

                card.addEventListener('click', function(e) {
                    e.preventDefault();
                    log('🖱️ CARD ' + index + ' CLICKED!');

                    const imageData = {
                        src: this.dataset.image,
                        title: this.dataset.title,
                        description: this.dataset.description
                    };

                    log('Image data: ' + JSON.stringify(imageData));

                    // Update modal
                    modalImage.src = imageData.src;
                    modalTitle.textContent = imageData.title;
                    modalDescription.textContent = imageData.description;

                    // Show modal
                    try {
                        if (!bsModal) {
                            bsModal = new bootstrap.Modal(modal);
                        }
                        bsModal.show();
                        log('✅ Modal shown successfully!');
                    } catch (error) {
                        log('❌ Modal error: ' + error.message);
                    }
                });
            });
        });
    </script>
</body>
</html>
