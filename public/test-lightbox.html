<!DOCTYPE html>
<html>
<head>
    <title>Gallery Lightbox Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .test-image {
            width: 200px;
            height: 200px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid #ddd;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>Gallery Lightbox Test</h1>

        <!-- Test Images -->
        <div class="row">
            <div class="col-md-4">
                <img src="https://picsum.photos/400/300?random=1"
                     class="test-image gallery-image"
                     alt="Test Image 1"
                     data-image="https://picsum.photos/800/600?random=1"
                     data-title="Test Image 1"
                     data-description="This is a test image">
            </div>
            <div class="col-md-4">
                <img src="https://picsum.photos/400/300?random=2"
                     class="test-image gallery-image"
                     alt="Test Image 2"
                     data-image="https://picsum.photos/800/600?random=2"
                     data-title="Test Image 2"
                     data-description="This is another test image">
            </div>
            <div class="col-md-4">
                <img src="https://picsum.photos/400/300?random=3"
                     class="test-image gallery-image"
                     alt="Test Image 3"
                     data-image="https://picsum.photos/800/600?random=3"
                     data-title="Test Image 3"
                     data-description="This is the third test image">
            </div>
        </div>

        <p class="mt-3"><strong>Instructions:</strong> Click on any image above to test the lightbox.</p>
        <div id="console-output" class="mt-3 p-3 bg-light border">
            <strong>Console Output:</strong><br>
        </div>
    </div>

    <!-- Image Modal -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="imageModalLabel">Photo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <img src="" alt="" class="img-fluid mb-3" id="modalImage">
                    <h6 id="modalTitle"></h6>
                    <p class="text-muted" id="modalDescription"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Logging function
        function log(message) {
            console.log(message);
            const output = document.getElementById('console-output');
            output.innerHTML += message + '<br>';
        }

        document.addEventListener('DOMContentLoaded', function () {
            log('DOM loaded');

            // Check Bootstrap
            if (typeof bootstrap === 'undefined') {
                log('ERROR: Bootstrap not loaded!');
                return;
            }
            log('Bootstrap found: ' + typeof bootstrap);

            const imageModal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            const modalTitle = document.getElementById('modalTitle');
            const modalDescription = document.getElementById('modalDescription');
            const galleryImages = Array.from(document.querySelectorAll('.gallery-image'));

            log('Found ' + galleryImages.length + ' gallery images');
            log('Modal element: ' + (imageModal ? 'found' : 'NOT FOUND'));

            // Handle image clicks
            galleryImages.forEach((img, index) => {
                img.addEventListener('click', function (e) {
                    e.preventDefault();
                    log('Image ' + index + ' clicked: ' + img.dataset.title);

                    modalImage.src = img.dataset.image;
                    modalImage.alt = img.dataset.title;
                    modalTitle.textContent = img.dataset.title;
                    modalDescription.textContent = img.dataset.description || '';

                    try {
                        const modal = new bootstrap.Modal(imageModal);
                        modal.show();
                        log('Modal shown successfully via Bootstrap');
                    } catch (error) {
                        log('ERROR showing modal: ' + error.message);
                        // Fallback
                        imageModal.style.display = 'block';
                        imageModal.classList.add('show');
                        document.body.classList.add('modal-open');
                        log('Fallback modal activated');
                    }
                });
            });

            log('Gallery lightbox initialized');
        });
    </script>
</body>
</html>
