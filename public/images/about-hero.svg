<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C25;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:0.9" />
    </linearGradient>
  </defs>

  <!-- Building outline -->
  <rect x="80" y="120" width="240" height="140" fill="url(#grad1)" rx="10"/>
  <rect x="100" y="100" width="200" height="20" fill="#2C5530" rx="5"/>

  <!-- Windows -->
  <rect x="110" y="140" width="25" height="25" fill="white" rx="3"/>
  <rect x="150" y="140" width="25" height="25" fill="white" rx="3"/>
  <rect x="190" y="140" width="25" height="25" fill="white" rx="3"/>
  <rect x="230" y="140" width="25" height="25" fill="white" rx="3"/>
  <rect x="270" y="140" width="25" height="25" fill="white" rx="3"/>

  <rect x="110" y="180" width="25" height="25" fill="white" rx="3"/>
  <rect x="150" y="180" width="25" height="25" fill="white" rx="3"/>
  <rect x="190" y="180" width="25" height="25" fill="white" rx="3"/>
  <rect x="230" y="180" width="25" height="25" fill="white" rx="3"/>
  <rect x="270" y="180" width="25" height="25" fill="white" rx="3"/>

  <!-- Door -->
  <rect x="180" y="220" width="40" height="40" fill="#2C5530" rx="5"/>
  <circle cx="210" cy="240" r="2" fill="white"/>

  <!-- Flag -->
  <rect x="340" y="60" width="3" height="80" fill="#2C5530"/>
  <rect x="315" y="60" width="25" height="15" fill="#E74C25"/>
  <rect x="315" y="75" width="25" height="15" fill="#F7931E"/>
  <rect x="315" y="90" width="25" height="15" fill="#2C5530"/>

  <!-- Trees -->
  <circle cx="50" cy="200" r="25" fill="#16a34a"/>
  <rect x="47" y="225" width="6" height="30" fill="#8B4513"/>

  <circle cx="360" cy="190" r="20" fill="#16a34a"/>
  <rect x="357" y="210" width="6" height="25" fill="#8B4513"/>

  <!-- Text -->
  <text x="200" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C5530">About Us</text>
</svg>
