<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="classroomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Classroom background -->
  <rect width="600" height="400" fill="url(#classroomBg)"/>

  <!-- Blackboard -->
  <rect x="50" y="50" width="300" height="150" fill="#2d4a22" stroke="#1a365d" stroke-width="3"/>
  <text x="200" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">WELCOME TO</text>
  <text x="200" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">OUR CLASSROOM</text>
  <text x="200" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#f59e0b">Learning Together!</text>

  <!-- Desks and students -->
  <!-- Desk 1 -->
  <rect x="100" y="250" width="80" height="50" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <!-- Student 1 -->
  <circle cx="140" cy="240" r="15" fill="#D2691E"/>
  <rect x="130" y="225" width="20" height="25" fill="#1a365d"/>

  <!-- Desk 2 -->
  <rect x="220" y="250" width="80" height="50" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <!-- Student 2 -->
  <circle cx="260" cy="240" r="15" fill="#CD853F"/>
  <rect x="250" y="225" width="20" height="25" fill="#2563eb"/>

  <!-- Desk 3 -->
  <rect x="340" y="250" width="80" height="50" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <!-- Student 3 -->
  <circle cx="380" cy="240" r="15" fill="#DEB887"/>
  <rect x="370" y="225" width="20" height="25" fill="#f59e0b"/>

  <!-- Teacher's desk -->
  <rect x="450" y="220" width="100" height="60" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <!-- Teacher -->
  <circle cx="500" cy="210" r="18" fill="#D2691E"/>
  <rect x="485" y="190" width="30" height="35" fill="#1a365d"/>

  <!-- Books on teacher's desk -->
  <rect x="460" y="230" width="15" height="20" fill="#DC143C"/>
  <rect x="478" y="230" width="15" height="20" fill="#228B22"/>
  <rect x="496" y="230" width="15" height="20" fill="#1E90FF"/>

  <!-- Window -->
  <rect x="420" y="60" width="120" height="100" fill="#87CEEB" stroke="#1a365d" stroke-width="3"/>
  <line x1="480" y1="60" x2="480" y2="160" stroke="#1a365d" stroke-width="2"/>
  <line x1="420" y1="110" x2="540" y2="110" stroke="#1a365d" stroke-width="2"/>

  <!-- Some educational posters on wall -->
  <rect x="70" y="220" width="60" height="40" fill="#FFE4B5" stroke="#1a365d" stroke-width="1"/>
  <text x="100" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1a365d">ABC 123</text>

  <!-- Floor tiles pattern -->
  <defs>
    <pattern id="tiles" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#f1f5f9"/>
      <rect width="1" height="20" fill="#cbd5e1"/>
      <rect width="20" height="1" fill="#cbd5e1"/>
    </pattern>
  </defs>
  <rect x="0" y="320" width="600" height="80" fill="url(#tiles)"/>

  <!-- Ceiling lights -->
  <ellipse cx="150" cy="30" rx="30" ry="10" fill="#FFD700" opacity="0.7"/>
  <ellipse cx="350" cy="30" rx="30" ry="10" fill="#FFD700" opacity="0.7"/>
  <ellipse cx="500" cy="30" rx="30" ry="10" fill="#FFD700" opacity="0.7"/>
</svg>
