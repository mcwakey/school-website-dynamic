<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C25;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:0.9" />
    </linearGradient>
  </defs>

  <!-- Envelope -->
  <rect x="150" y="130" width="100" height="70" fill="white" stroke="#2C5530" stroke-width="3" rx="5"/>
  <polygon points="150,130 200,170 250,130" fill="url(#grad1)"/>

  <!-- Envelope flap -->
  <polygon points="150,130 200,170 250,130 220,150 180,150" fill="#E74C25" opacity="0.8"/>

  <!-- Phone -->
  <rect x="80" y="100" width="40" height="80" fill="#2C5530" rx="15"/>
  <rect x="85" y="110" width="30" height="50" fill="white" rx="5"/>
  <circle cx="100" cy="175" r="5" fill="white"/>
  <circle cx="100" cy="115" r="3" fill="#666"/>

  <!-- Phone screen elements -->
  <rect x="90" y="120" width="20" height="3" fill="#E74C25"/>
  <rect x="90" y="130" width="15" height="2" fill="#ddd"/>
  <rect x="90" y="135" width="18" height="2" fill="#ddd"/>
  <rect x="90" y="140" width="12" height="2" fill="#ddd"/>

  <!-- Location pin -->
  <path d="M 300 120 Q 290 100 300 80 Q 310 100 300 120" fill="#E74C25"/>
  <circle cx="300" cy="95" r="8" fill="white"/>
  <circle cx="300" cy="95" r="4" fill="#E74C25"/>

  <!-- Contact bubbles -->
  <circle cx="100" cy="220" r="20" fill="#F7931E" opacity="0.8"/>
  <text x="100" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="white">@</text>

  <circle cx="320" cy="180" r="18" fill="#2C5530" opacity="0.8"/>
  <text x="320" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">📞</text>

  <!-- Message lines -->
  <ellipse cx="200" cy="80" rx="60" ry="25" fill="white" stroke="#ddd" stroke-width="2"/>
  <line x1="165" y1="75" x2="235" y2="75" stroke="#ddd" stroke-width="1"/>
  <line x1="170" y1="82" x2="220" y2="82" stroke="#ddd" stroke-width="1"/>
  <line x1="175" y1="89" x2="225" y2="89" stroke="#ddd" stroke-width="1"/>

  <!-- Social media icons representation -->
  <rect x="50" y="50" width="25" height="25" fill="#E74C25" rx="5"/>
  <text x="62.5" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">f</text>

  <circle cx="350" cy="70" r="12" fill="#2C5530"/>
  <text x="350" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">in</text>

  <!-- Network lines -->
  <line x1="100" y1="220" x2="150" y2="200" stroke="#F7931E" stroke-width="2" opacity="0.5"/>
  <line x1="200" y1="170" x2="280" y2="180" stroke="#E74C25" stroke-width="2" opacity="0.5"/>
  <line x1="300" y1="120" x2="320" y2="160" stroke="#2C5530" stroke-width="2" opacity="0.5"/>

  <!-- Text -->
  <text x="200" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C5530">Contact Us</text>
</svg>
