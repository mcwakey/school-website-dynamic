<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sportsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sports field background -->
  <rect width="400" height="300" fill="url(#sportsBg)"/>

  <!-- Field lines -->
  <line x1="0" y1="150" x2="400" y2="150" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
  <circle cx="200" cy="150" r="80" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
  <circle cx="200" cy="150" r="5" fill="#ffffff" opacity="0.8"/>

  <!-- Goal posts -->
  <rect x="10" y="120" width="5" height="60" fill="#ffffff"/>
  <rect x="5" y="115" width="15" height="5" fill="#ffffff"/>

  <rect x="385" y="120" width="5" height="60" fill="#ffffff"/>
  <rect x="385" y="115" width="15" height="5" fill="#ffffff"/>

  <!-- Students playing -->
  <!-- Student 1 -->
  <circle cx="120" cy="130" r="12" fill="#D2691E"/>
  <rect x="112" y="115" width="16" height="20" fill="#1a365d"/>
  <rect x="110" y="135" width="8" height="25" fill="#000000"/>
  <rect x="122" y="135" width="8" height="25" fill="#000000"/>

  <!-- Student 2 -->
  <circle cx="180" cy="170" r="12" fill="#CD853F"/>
  <rect x="172" y="155" width="16" height="20" fill="#dc2626"/>
  <rect x="170" y="175" width="8" height="25" fill="#000000"/>
  <rect x="182" y="175" width="8" height="25" fill="#000000"/>

  <!-- Student 3 -->
  <circle cx="250" cy="120" r="12" fill="#DEB887"/>
  <rect x="242" y="105" width="16" height="20" fill="#2563eb"/>
  <rect x="240" y="125" width="8" height="25" fill="#000000"/>
  <rect x="252" y="125" width="8" height="25" fill="#000000"/>

  <!-- Football -->
  <circle cx="200" cy="140" r="8" fill="#000000"/>
  <ellipse cx="200" cy="140" rx="6" ry="3" fill="#ffffff"/>
  <ellipse cx="200" cy="140" rx="3" ry="6" fill="#ffffff"/>

  <!-- Trees in background -->
  <ellipse cx="50" cy="250" rx="25" ry="40" fill="#166534" opacity="0.7"/>
  <ellipse cx="350" cy="260" rx="30" ry="45" fill="#166534" opacity="0.7"/>

  <!-- Sky -->
  <rect y="0" width="400" height="80" fill="#87CEEB" opacity="0.3"/>

  <!-- Sun -->
  <circle cx="350" cy="40" r="20" fill="#FFD700" opacity="0.8"/>

  <!-- Title -->
  <rect x="50" y="20" width="300" height="30" fill="#ffffff" opacity="0.9" rx="5"/>
  <text x="200" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a365d">Sports Day Activities</text>
</svg>
