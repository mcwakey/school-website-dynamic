<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="academicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef7ed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fed7aa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Academic background -->
  <rect width="600" height="400" fill="url(#academicBg)"/>

  <!-- Floor -->
  <rect y="350" width="600" height="50" fill="#92400e"/>

  <!-- Large books stack -->
  <rect x="100" y="250" width="80" height="100" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
  <rect x="120" y="240" width="80" height="100" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="140" y="230" width="80" height="100" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
  <rect x="160" y="220" width="80" height="100" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>

  <!-- Globe -->
  <circle cx="400" cy="280" r="50" fill="#22d3ee" stroke="#0891b2" stroke-width="3"/>
  <!-- Continents on globe -->
  <path d="M370,260 Q390,250 410,260 Q420,280 400,290 Q380,285 370,260" fill="#16a34a"/>
  <path d="M410,260 Q430,255 440,275 Q425,295 410,290 Q410,275 410,260" fill="#16a34a"/>

  <!-- Student studying -->
  <circle cx="300" cy="280" r="15" fill="#D2691E"/>
  <rect x="290" y="260" width="20" height="25" fill="#1a365d"/>

  <!-- Open book in front of student -->
  <rect x="280" y="300" width="40" height="25" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <line x1="300" y1="300" x2="300" y2="325" stroke="#000000" stroke-width="1"/>

  <!-- Pencils in holder -->
  <rect x="480" y="270" width="30" height="60" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <rect x="485" y="250" width="4" height="30" fill="#FFD700"/>
  <rect x="490" y="250" width="4" height="30" fill="#dc2626"/>
  <rect x="495" y="250" width="4" height="30" fill="#2563eb"/>
  <rect x="500" y="250" width="4" height="30" fill="#16a34a"/>
  <rect x="505" y="250" width="4" height="30" fill="#7c3aed"/>

  <!-- Ruler -->
  <rect x="520" y="300" width="60" height="8" fill="#FFD700" stroke="#f59e0b" stroke-width="1"/>
  <!-- Ruler markings -->
  <line x1="525" y1="300" x2="525" y2="308" stroke="#000000" stroke-width="0.5"/>
  <line x1="535" y1="300" x2="535" y2="308" stroke="#000000" stroke-width="0.5"/>
  <line x1="545" y1="300" x2="545" y2="308" stroke="#000000" stroke-width="0.5"/>
  <line x1="555" y1="300" x2="555" y2="308" stroke="#000000" stroke-width="0.5"/>
  <line x1="565" y1="300" x2="565" y2="308" stroke="#000000" stroke-width="0.5"/>
  <line x1="575" y1="300" x2="575" y2="308" stroke="#000000" stroke-width="0.5"/>

  <!-- Calculator -->
  <rect x="50" y="300" width="60" height="80" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <rect x="55" y="305" width="50" height="20" fill="#065f46"/>
  <text x="80" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">123.45</text>

  <!-- Calculator buttons -->
  <rect x="60" y="330" width="8" height="8" fill="#6b7280"/>
  <rect x="70" y="330" width="8" height="8" fill="#6b7280"/>
  <rect x="80" y="330" width="8" height="8" fill="#6b7280"/>
  <rect x="90" y="330" width="8" height="8" fill="#6b7280"/>

  <rect x="60" y="340" width="8" height="8" fill="#6b7280"/>
  <rect x="70" y="340" width="8" height="8" fill="#6b7280"/>
  <rect x="80" y="340" width="8" height="8" fill="#6b7280"/>
  <rect x="90" y="340" width="8" height="8" fill="#6b7280"/>

  <!-- Alphabet cards scattered -->
  <rect x="350" y="200" width="30" height="30" fill="#ffffff" stroke="#1a365d" stroke-width="2"/>
  <text x="365" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a365d">A</text>

  <rect x="400" y="180" width="30" height="30" fill="#ffffff" stroke="#1a365d" stroke-width="2"/>
  <text x="415" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a365d">B</text>

  <rect x="450" y="160" width="30" height="30" fill="#ffffff" stroke="#1a365d" stroke-width="2"/>
  <text x="465" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a365d">C</text>

  <!-- Mathematical formulas on floating papers -->
  <rect x="150" y="150" width="80" height="60" fill="#ffffff" stroke="#1a365d" stroke-width="1" transform="rotate(-10 190 180)"/>
  <text x="190" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1a365d">2 + 2 = 4</text>
  <text x="190" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1a365d">5 × 3 = 15</text>
  <text x="190" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1a365d">10 ÷ 2 = 5</text>

  <!-- Academic achievement stars -->
  <polygon points="50,80 55,90 65,90 57,97 60,107 50,100 40,107 43,97 35,90 45,90" fill="#FFD700" stroke="#f59e0b" stroke-width="1"/>
  <polygon points="520,60 525,70 535,70 527,77 530,87 520,80 510,87 513,77 505,70 515,70" fill="#FFD700" stroke="#f59e0b" stroke-width="1"/>
  <polygon points="300,50 305,60 315,60 307,67 310,77 300,70 290,77 293,67 285,60 295,60" fill="#FFD700" stroke="#f59e0b" stroke-width="1"/>

  <!-- Title banner -->
  <rect x="50" y="20" width="500" height="40" fill="#1a365d" opacity="0.9" rx="5"/>
  <text x="300" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Academic Excellence</text>
</svg>
