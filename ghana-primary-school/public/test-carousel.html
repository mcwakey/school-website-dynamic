<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Carousel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid p-0">
        <div id="testCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
            <!-- Indicators -->
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#testCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#testCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#testCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>

            <!-- Slides -->
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <div class="d-flex align-items-center justify-content-center" style="height: 60vh; background: linear-gradient(135deg, #E74C25, #2C5530);">
                        <div class="text-center text-white">
                            <h1>Slide 1</h1>
                            <p>This is the first slide content</p>
                        </div>
                    </div>
                </div>
                <div class="carousel-item">
                    <div class="d-flex align-items-center justify-content-center" style="height: 60vh; background: linear-gradient(135deg, #2C5530, #F7931E);">
                        <div class="text-center text-white">
                            <h1>Slide 2</h1>
                            <p>This is the second slide content</p>
                        </div>
                    </div>
                </div>
                <div class="carousel-item">
                    <div class="d-flex align-items-center justify-content-center" style="height: 60vh; background: linear-gradient(135deg, #F7931E, #E74C25);">
                        <div class="text-center text-white">
                            <h1>Slide 3</h1>
                            <p>This is the third slide content</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Navigation Controls -->
            <button class="carousel-control-prev" type="button" data-bs-target="#testCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#testCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Test carousel page loaded');

            const carousel = document.getElementById('testCarousel');
            if (carousel) {
                const carouselInstance = new bootstrap.Carousel(carousel, {
                    interval: 3000,
                    wrap: true,
                    pause: 'hover'
                });

                carousel.addEventListener('slide.bs.carousel', function(event) {
                    console.log('Sliding from slide', event.from, 'to slide', event.to);
                });

                console.log('Carousel initialized with', carousel.querySelectorAll('.carousel-item').length, 'slides');
            }
        });
    </script>
</body>
</html>
