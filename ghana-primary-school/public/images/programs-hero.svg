<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C25;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:0.9" />
    </linearGradient>
  </defs>

  <!-- Books stack -->
  <rect x="120" y="180" width="80" height="12" fill="#E74C25" rx="2"/>
  <rect x="125" y="168" width="70" height="12" fill="#F7931E" rx="2"/>
  <rect x="130" y="156" width="60" height="12" fill="#2C5530" rx="2"/>
  <rect x="135" y="144" width="50" height="12" fill="#16a34a" rx="2"/>

  <!-- Graduation cap -->
  <circle cx="250" cy="120" r="35" fill="#2C5530"/>
  <rect x="240" y="105" width="20" height="30" fill="#E74C25"/>
  <polygon points="250,85 270,95 230,95" fill="#2C5530"/>
  <circle cx="270" cy="95" r="3" fill="#F7931E"/>

  <!-- Apple -->
  <circle cx="320" cy="160" r="18" fill="#E74C25"/>
  <ellipse cx="320" cy="158" rx="15" ry="18" fill="#dc2626"/>
  <rect x="318" y="140" width="4" height="8" fill="#16a34a"/>
  <ellipse cx="322" cy="142" rx="6" ry="3" fill="#16a34a"/>

  <!-- Pencils -->
  <rect x="80" y="120" width="8" height="60" fill="#F7931E"/>
  <polygon points="80,120 88,120 84,110" fill="#2C5530"/>
  <rect x="80" y="175" width="8" height="5" fill="#FFB6C1"/>

  <rect x="95" y="130" width="8" height="50" fill="#E74C25"/>
  <polygon points="95,130 103,130 99,120" fill="#2C5530"/>
  <rect x="95" y="175" width="8" height="5" fill="#FFB6C1"/>

  <!-- Mathematical symbols -->
  <text x="150" y="100" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C5530">ABC</text>
  <text x="280" y="220" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#E74C25">123</text>

  <!-- Plus sign -->
  <rect x="60" y="240" width="20" height="4" fill="#16a34a"/>
  <rect x="68" y="232" width="4" height="20" fill="#16a34a"/>

  <!-- Text -->
  <text x="200" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C5530">Academic Programs</text>
</svg>
