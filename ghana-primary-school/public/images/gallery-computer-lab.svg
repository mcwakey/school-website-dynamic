<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="labBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Lab background -->
  <rect width="400" height="300" fill="url(#labBg)"/>

  <!-- Floor -->
  <rect y="250" width="400" height="50" fill="#64748b"/>

  <!-- Lab tables -->
  <rect x="50" y="180" width="100" height="70" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <rect x="250" y="180" width="100" height="70" fill="#8B4513" stroke="#654321" stroke-width="2"/>

  <!-- Computers -->
  <rect x="60" y="160" width="80" height="50" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <rect x="65" y="165" width="70" height="35" fill="#3b82f6"/>
  <rect x="70" y="170" width="60" height="25" fill="#ffffff"/>

  <rect x="260" y="160" width="80" height="50" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <rect x="265" y="165" width="70" height="35" fill="#3b82f6"/>
  <rect x="270" y="170" width="60" height="25" fill="#ffffff"/>

  <!-- Students at computers -->
  <!-- Student 1 -->
  <circle cx="100" cy="150" r="10" fill="#D2691E"/>
  <rect x="93" y="138" width="14" height="18" fill="#1a365d"/>

  <!-- Student 2 -->
  <circle cx="300" cy="150" r="10" fill="#CD853F"/>
  <rect x="293" y="138" width="14" height="18" fill="#dc2626"/>

  <!-- Teacher -->
  <circle cx="200" cy="120" r="12" fill="#DEB887"/>
  <rect x="192" y="105" width="16" height="20" fill="#059669"/>

  <!-- Whiteboard -->
  <rect x="100" y="50" width="200" height="80" fill="#ffffff" stroke="#1a365d" stroke-width="3"/>
  <text x="200" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1a365d">COMPUTER LAB</text>
  <text x="200" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1a365d">Learning Technology</text>
  <text x="200" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1a365d">Today: Basic Programming</text>

  <!-- Ceiling lights -->
  <ellipse cx="120" cy="20" rx="25" ry="8" fill="#FFD700" opacity="0.8"/>
  <ellipse cx="280" cy="20" rx="25" ry="8" fill="#FFD700" opacity="0.8"/>

  <!-- Windows -->
  <rect x="20" y="60" width="60" height="80" fill="#87CEEB" stroke="#1a365d" stroke-width="2"/>
  <line x1="50" y1="60" x2="50" y2="140" stroke="#1a365d" stroke-width="1"/>
  <line x1="20" y1="100" x2="80" y2="100" stroke="#1a365d" stroke-width="1"/>

  <rect x="320" y="60" width="60" height="80" fill="#87CEEB" stroke="#1a365d" stroke-width="2"/>
  <line x1="350" y1="60" x2="350" y2="140" stroke="#1a365d" stroke-width="1"/>
  <line x1="320" y1="100" x2="380" y2="100" stroke="#1a365d" stroke-width="1"/>

  <!-- Title overlay -->
  <rect x="50" y="20" width="300" height="25" fill="#1a365d" opacity="0.9" rx="5"/>
  <text x="200" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Computer Learning Lab</text>
</svg>
