<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="libraryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef7ed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fed7aa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Library background -->
  <rect width="400" height="300" fill="url(#libraryBg)"/>

  <!-- Floor -->
  <rect y="250" width="400" height="50" fill="#92400e"/>

  <!-- Bookshelves -->
  <rect x="30" y="80" width="20" height="170" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <rect x="70" y="80" width="20" height="170" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <rect x="110" y="80" width="20" height="170" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <rect x="150" y="80" width="20" height="170" fill="#8B4513" stroke="#654321" stroke-width="2"/>

  <!-- Books on shelves -->
  <!-- Shelf 1 -->
  <rect x="32" y="90" width="4" height="25" fill="#dc2626"/>
  <rect x="36" y="90" width="4" height="25" fill="#2563eb"/>
  <rect x="40" y="90" width="4" height="25" fill="#16a34a"/>
  <rect x="44" y="90" width="4" height="25" fill="#f59e0b"/>

  <rect x="32" y="130" width="4" height="25" fill="#7c3aed"/>
  <rect x="36" y="130" width="4" height="25" fill="#db2777"/>
  <rect x="40" y="130" width="4" height="25" fill="#059669"/>
  <rect x="44" y="130" width="4" height="25" fill="#dc2626"/>

  <!-- Shelf 2 -->
  <rect x="72" y="90" width="4" height="25" fill="#2563eb"/>
  <rect x="76" y="90" width="4" height="25" fill="#f59e0b"/>
  <rect x="80" y="90" width="4" height="25" fill="#16a34a"/>
  <rect x="84" y="90" width="4" height="25" fill="#dc2626"/>

  <rect x="72" y="130" width="4" height="25" fill="#059669"/>
  <rect x="76" y="130" width="4" height="25" fill="#7c3aed"/>
  <rect x="80" y="130" width="4" height="25" fill="#db2777"/>
  <rect x="84" y="130" width="4" height="25" fill="#f59e0b"/>

  <!-- Reading tables -->
  <rect x="220" y="180" width="80" height="60" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <rect x="320" y="180" width="80" height="60" fill="#8B4513" stroke="#654321" stroke-width="2"/>

  <!-- Students reading -->
  <!-- Student 1 -->
  <circle cx="260" cy="170" r="10" fill="#D2691E"/>
  <rect x="253" y="158" width="14" height="18" fill="#1a365d"/>
  <rect x="245" y="180" width="30" height="15" fill="#ffffff" stroke="#000000" stroke-width="1"/>

  <!-- Student 2 -->
  <circle cx="360" cy="170" r="10" fill="#CD853F"/>
  <rect x="353" y="158" width="14" height="18" fill="#dc2626"/>
  <rect x="345" y="180" width="30" height="15" fill="#ffffff" stroke="#000000" stroke-width="1"/>

  <!-- Librarian -->
  <circle cx="200" cy="120" r="12" fill="#DEB887"/>
  <rect x="192" y="105" width="16" height="20" fill="#059669"/>

  <!-- Library counter -->
  <rect x="180" y="140" width="60" height="30" fill="#8B4513" stroke="#654321" stroke-width="2"/>

  <!-- Windows -->
  <rect x="250" y="60" width="120" height="80" fill="#87CEEB" stroke="#1a365d" stroke-width="2"/>
  <line x1="310" y1="60" x2="310" y2="140" stroke="#1a365d" stroke-width="2"/>
  <line x1="250" y1="100" x2="370" y2="100" stroke="#1a365d" stroke-width="2"/>

  <!-- Ceiling -->
  <rect y="0" width="400" height="50" fill="#e5e7eb"/>
  <!-- Ceiling lights -->
  <ellipse cx="100" cy="25" rx="30" ry="10" fill="#FFD700" opacity="0.8"/>
  <ellipse cx="250" cy="25" rx="30" ry="10" fill="#FFD700" opacity="0.8"/>

  <!-- Title -->
  <rect x="50" y="15" width="300" height="25" fill="#1a365d" opacity="0.9" rx="5"/>
  <text x="200" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">School Library</text>
</svg>
