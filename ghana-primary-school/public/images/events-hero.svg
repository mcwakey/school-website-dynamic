<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C25;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:0.9" />
    </linearGradient>
  </defs>

  <!-- Calendar -->
  <rect x="150" y="80" width="100" height="120" fill="white" stroke="#2C5530" stroke-width="2" rx="5"/>
  <rect x="150" y="80" width="100" height="20" fill="#E74C25" rx="5"/>

  <!-- Calendar rings -->
  <circle cx="170" cy="75" r="3" fill="#2C5530"/>
  <circle cx="230" cy="75" r="3" fill="#2C5530"/>

  <!-- Calendar grid -->
  <line x1="170" y1="110" x2="230" y2="110" stroke="#ddd" stroke-width="1"/>
  <line x1="170" y1="130" x2="230" y2="130" stroke="#ddd" stroke-width="1"/>
  <line x1="170" y1="150" x2="230" y2="150" stroke="#ddd" stroke-width="1"/>
  <line x1="170" y1="170" x2="230" y2="170" stroke="#ddd" stroke-width="1"/>

  <line x1="180" y1="100" x2="180" y2="190" stroke="#ddd" stroke-width="1"/>
  <line x1="200" y1="100" x2="200" y2="190" stroke="#ddd" stroke-width="1"/>
  <line x1="220" y1="100" x2="220" y2="190" stroke="#ddd" stroke-width="1"/>

  <!-- Event marker -->
  <circle cx="190" cy="140" r="4" fill="#F7931E"/>
  <circle cx="210" cy="160" r="4" fill="#16a34a"/>

  <!-- Balloons -->
  <ellipse cx="100" cy="120" rx="12" ry="18" fill="#E74C25"/>
  <ellipse cx="115" cy="110" rx="12" ry="18" fill="#F7931E"/>
  <ellipse cx="85" cy="105" rx="12" ry="18" fill="#2C5530"/>

  <!-- Balloon strings -->
  <line x1="100" y1="138" x2="100" y2="180" stroke="#333" stroke-width="1"/>
  <line x1="115" y1="128" x2="115" y2="180" stroke="#333" stroke-width="1"/>
  <line x1="85" y1="123" x2="85" y2="180" stroke="#333" stroke-width="1"/>

  <!-- Party hat -->
  <polygon points="320,120 340,160 300,160" fill="#E74C25"/>
  <circle cx="320" cy="120" r="3" fill="#F7931E"/>
  <polygon points="315,140 325,140 320,150" fill="white"/>
  <polygon points="315,150 325,150 320,160" fill="white"/>

  <!-- Confetti -->
  <rect x="280" y="100" width="4" height="4" fill="#F7931E" transform="rotate(45 282 102)"/>
  <rect x="350" y="110" width="4" height="4" fill="#E74C25" transform="rotate(30 352 112)"/>
  <rect x="320" y="90" width="4" height="4" fill="#16a34a" transform="rotate(60 322 92)"/>
  <rect x="290" y="180" width="4" height="4" fill="#2C5530" transform="rotate(15 292 182)"/>
  <rect x="360" y="170" width="4" height="4" fill="#F7931E" transform="rotate(75 362 172)"/>

  <!-- Musical notes -->
  <circle cx="70" cy="180" r="4" fill="#2C5530"/>
  <rect x="74" y="160" width="2" height="20" fill="#2C5530"/>
  <path d="M 76 160 Q 82 155 82 165" stroke="#2C5530" stroke-width="2" fill="none"/>

  <circle cx="340" cy="200" r="4" fill="#E74C25"/>
  <rect x="344" y="180" width="2" height="20" fill="#E74C25"/>
  <path d="M 346 180 Q 352 175 352 185" stroke="#E74C25" stroke-width="2" fill="none"/>

  <!-- Text -->
  <text x="200" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C5530">School Events</text>
</svg>
