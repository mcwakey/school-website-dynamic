<!-- Beautiful Hero Image Placeholder - Replace with actual school photo -->
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="schoolGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2691E;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="800" height="400" fill="url(#skyGradient)"/>

  <!-- Ground -->
  <rect y="400" width="800" height="200" fill="#228B22"/>

  <!-- School building -->
  <rect x="150" y="200" width="500" height="200" fill="url(#schoolGradient)" stroke="#654321" stroke-width="2"/>

  <!-- Roof -->
  <polygon points="125,200 400,100 675,200" fill="#8B0000" stroke="#654321" stroke-width="2"/>

  <!-- Windows -->
  <rect x="200" y="240" width="60" height="80" fill="#87CEEB" stroke="#654321" stroke-width="2"/>
  <rect x="300" y="240" width="60" height="80" fill="#87CEEB" stroke="#654321" stroke-width="2"/>
  <rect x="440" y="240" width="60" height="80" fill="#87CEEB" stroke="#654321" stroke-width="2"/>
  <rect x="540" y="240" width="60" height="80" fill="#87CEEB" stroke="#654321" stroke-width="2"/>

  <!-- Door -->
  <rect x="370" y="280" width="60" height="120" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <circle cx="415" cy="340" r="3" fill="#FFD700"/>

  <!-- School sign -->
  <rect x="250" y="150" width="300" height="40" fill="#FFFFFF" stroke="#1a365d" stroke-width="2"/>
  <text x="400" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a365d">GHANA EXCELLENCE PRIMARY</text>

  <!-- Trees -->
  <circle cx="100" cy="350" r="50" fill="#228B22"/>
  <rect x="95" y="350" width="10" height="50" fill="#8B4513"/>

  <circle cx="700" cy="350" r="50" fill="#228B22"/>
  <rect x="695" y="350" width="10" height="50" fill="#8B4513"/>

  <!-- Clouds -->
  <circle cx="150" cy="100" r="30" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="170" cy="90" r="40" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="190" cy="100" r="30" fill="#FFFFFF" opacity="0.8"/>

  <circle cx="600" cy="80" r="25" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="615" cy="70" r="35" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="635" cy="80" r="25" fill="#FFFFFF" opacity="0.8"/>

  <!-- Sun -->
  <circle cx="700" cy="80" r="40" fill="#FFD700" opacity="0.9"/>
</svg>
