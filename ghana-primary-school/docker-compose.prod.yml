# Production Docker Compose
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ghana_primary_school_app_prod
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - storage_data:/var/www/html/storage
      - ./public/uploads:/var/www/html/public/uploads
    networks:
      - ghana_primary_school_prod
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=mysql
      - DB_DATABASE=ghana_primary_school
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: ghana_primary_school_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - storage_data:/var/www/html/storage
      - ./public:/var/www/html/public
    networks:
      - ghana_primary_school_prod
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: ghana_primary_school_mysql_prod
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ghana_primary_school
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: laravel
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./docker/mysql/prod.cnf:/etc/mysql/conf.d/custom.cnf
    networks:
      - ghana_primary_school_prod
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:alpine
    container_name: ghana_primary_school_redis_prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    networks:
      - ghana_primary_school_prod

  backup:
    image: mysql:8.0
    container_name: ghana_primary_school_backup
    restart: "no"
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./backups:/backups
    networks:
      - ghana_primary_school_prod
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    entrypoint: |
      bash -c '
      set -e
      echo "Starting backup at $$(date)"
      mysqldump -h mysql -uroot -p${DB_PASSWORD} ghana_primary_school > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql
      echo "Backup completed at $$(date)"
      # Keep only last 7 days of backups
      find /backups -name "backup_*.sql" -mtime +7 -delete
      '
    depends_on:
      - mysql

networks:
  ghana_primary_school_prod:
    driver: bridge

volumes:
  mysql_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  storage_data:
    driver: local
